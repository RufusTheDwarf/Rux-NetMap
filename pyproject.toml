# RUX · Onlyrutsuu
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rux-lan-inventory"
version = "1.1.0"
description = "Inventaire desktop d'un segment IPv4 privé sous Windows."
authors = [{name = "Onlyrutsuu"}]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6-Essentials==6.10.3"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[project.gui-scripts]
rux = "main:main"

[tool.setuptools]
packages = ["core", "agents", "skills", "gui", "data"]
py-modules = ["main"]

[tool.setuptools.package-data]
data = ["*.csv", "*.ico", "*.txt", "licenses/*.txt"]
